[workspace]
resolver = "3"
members = ["oxitoken", "oxitoken-macros"]

[workspace.package]
authors = ["Dwayne Sykes <github-public@sykes.pw>"]
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/dsykes16/oxiauth"
# Keep in sync with RUST_MSRV in .github/workflows/ci.yml.
rust-version = "1.88.0"

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "fat"

[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
unsafe_code = "forbid"
warnings = "deny"
#missing_docs = "deny"
# coverage is checked w/ nightly to exclude test code from coverage calculations
# this allows building and testing on stable and msrv w/o warnings
unexpected_cfgs = { level = "allow", check-cfg = [
	"cfg(coverage,coverage_nightly)",
] }


[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
